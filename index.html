<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StudLink Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : tableau de bord de pilotage, une colonne lisible, en-tête collant + onglets ; fond à halos StudLink (bleu haut-gauche, pêche bas-droite) */
:root{
  --bg:#EAF0FA; --halo-a:rgba(160,196,250,.75); --halo-b:rgba(252,208,150,.75);
  --surface:rgba(255,255,255,.74); --surface-2:rgba(255,255,255,.5); --solid:#FFFFFF;
  --ink:#0E1626; --muted:#566380; --line:rgba(28,52,98,.13);
  --blue:#3366E0; --blue-2:#3A90E8; --blue-soft:rgba(51,102,224,.1);
  --orange:#FF8A4C; --orange-2:#FFB547; --orange-ink:#B9501B; --orange-soft:rgba(255,138,76,.14);
  --good:#178A5E; --good-soft:rgba(23,138,94,.12); --warn:#A86508; --warn-soft:rgba(214,140,20,.14);
  --f-display:"Gabarito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --halo-a:rgba(51,102,224,.30); --halo-b:rgba(255,138,76,.16);
  --surface:rgba(19,29,52,.80); --surface-2:rgba(19,29,52,.55); --solid:#141E36;
  --ink:#E7EDF8; --muted:#97A5C0; --line:rgba(200,215,245,.13);
  --blue:#7AA2FF; --blue-2:#5FB0FF; --blue-soft:rgba(122,162,255,.14);
  --orange:#FF9D66; --orange-2:#FFC266; --orange-ink:#FFB385; --orange-soft:rgba(255,157,102,.15);
  --good:#4CCB98; --good-soft:rgba(76,203,152,.14); --warn:#F2B455; --warn-soft:rgba(242,180,85,.14);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1120; --halo-a:rgba(51,102,224,.30); --halo-b:rgba(255,138,76,.16);
  --surface:rgba(19,29,52,.80); --surface-2:rgba(19,29,52,.55); --solid:#141E36;
  --ink:#E7EDF8; --muted:#97A5C0; --line:rgba(200,215,245,.13);
  --blue:#7AA2FF; --blue-2:#5FB0FF; --blue-soft:rgba(122,162,255,.14);
  --orange:#FF9D66; --orange-2:#FFC266; --orange-ink:#FFB385; --orange-soft:rgba(255,157,102,.15);
  --good:#4CCB98; --good-soft:rgba(76,203,152,.14); --warn:#F2B455; --warn-soft:rgba(242,180,85,.14);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;position:relative}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%}
body::before{top:-28vmax;left:-24vmax;width:70vmax;height:70vmax;background:radial-gradient(circle at 45% 45%,var(--halo-a) 0%,transparent 68%)}
body::after{bottom:-30vmax;right:-26vmax;width:74vmax;height:74vmax;background:radial-gradient(circle at 55% 55%,var(--halo-b) 0%,transparent 66%)}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,1.2rem + 1.4vw,2.1rem);font-weight:700;line-height:1.1}
h3{font-size:1.08rem;font-weight:600;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-20px;padding:12px 20px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand svg{width:40px;height:40px;flex:none;color:var(--ink)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1}
.brand-sub{font-size:.82rem;color:var(--muted)}
.save{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted)}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save[data-s="ok"] i{background:var(--good)} .save[data-s="busy"] i{background:var(--orange)} .save[data-s="local"] i{background:var(--warn)}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 14px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

/* Blocs */
.view{display:grid;gap:22px;padding-top:26px}
.head{display:grid;gap:6px}
.head p{max-width:62ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.panel>h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.est{background:var(--warn-soft);color:var(--warn)}
.chip.or{background:var(--orange-soft);color:var(--orange-ink)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--orange);padding:4px 0 4px 12px;max-width:70ch}
.btn{border:1px solid var(--line);background:var(--solid);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.86rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:linear-gradient(100deg,var(--blue),var(--blue-2));color:#fff;border-color:transparent}
.btn.small{padding:5px 11px;font-size:.8rem}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
input.field,select.field,textarea.field{width:100%;background:var(--solid);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
label.lab{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}

/* Semaine */
.week-hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.week-hero{grid-template-columns:1fr}}
.wk-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wk-num{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,2rem + 3vw,4rem);line-height:.9;background:linear-gradient(100deg,var(--blue),var(--blue-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--orange-2));transition:width .4s ease}
.bar.blue>span{background:linear-gradient(90deg,var(--blue),var(--blue-2))}
.bar.done>span{background:var(--good)}
.owners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.owner-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.owner-h input{font-family:var(--f-display);font-weight:700;font-size:1.05rem;border:0;background:none;padding:2px 4px;margin-left:-4px;border-radius:6px;min-width:0;flex:1}
.owner-h input:hover{background:var(--surface-2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:.9rem}
.av.a{background:linear-gradient(135deg,var(--blue),var(--blue-2))} .av.b{background:linear-gradient(135deg,var(--orange),var(--orange-2))}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:21px;height:21px;border:2px solid var(--muted);border-radius:6px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--solid)}
.task input:checked{background:var(--good);border-color:var(--good)}
.task input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .tx{display:grid;gap:1px;min-width:0}
.task b{font-weight:700}
.task small{color:var(--muted);font-size:.82rem}
.task.on b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.countdown{display:grid;gap:4px}
.cd-n{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--orange-ink)}
.mini{display:grid;gap:12px}
.mini-row{display:grid;gap:5px}
.mini-row .lt{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list-plain li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;flex-wrap:wrap}

/* Objectifs */
.kpis{display:grid;gap:10px}
.kpi{display:grid;grid-template-columns:minmax(0,1.5fr) 110px 110px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi .nm{display:grid;gap:4px;min-width:0}
.kpi .nm b{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.kpi .pct{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.kpi .auto{font-size:1.1rem;font-weight:700;padding:8px 2px}
.kpi-head{display:grid;grid-template-columns:minmax(0,1.5fr) 110px 110px minmax(0,1fr);gap:14px;padding:0 16px}
@media (max-width:700px){
  .kpi{grid-template-columns:1fr 1fr}
  .kpi .nm,.kpi .prog{grid-column:1/-1}
  .kpi-head{display:none}
}
.group-l{margin-top:10px}
.base{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}

/* Lycéens */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.pillar{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;align-content:start}
.pillar .k{font-family:var(--f-display);font-weight:800;font-size:.8rem;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.rhythm div{display:grid;gap:2px}
.rhythm strong{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface-2);padding:6px 12px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.idea{display:grid;gap:8px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-content:start;min-width:0}
.idea.shot{opacity:.62}
.idea .top-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idea h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.25}
.hook{font-style:italic;padding:8px 10px;border-radius:var(--r-sm);background:var(--orange-soft);font-size:.9rem}
.hook::before{content:"0–3 s · ";font-style:normal;font-weight:700;color:var(--orange-ink);font-size:.78rem}
.meta{font-size:.82rem;color:var(--muted)}
.offline{display:grid;gap:0}
.off{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.off:first-child{border-top:0;padding-top:0}
@media (max-width:640px){.off{grid-template-columns:1fr;gap:6px}}
.off b{font-family:var(--f-display);font-weight:600}
.legal{background:var(--blue-soft);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}
.legal ul{margin:0;padding-left:18px;display:grid;gap:5px}

/* Écoles */
.tier{display:grid;gap:8px;align-content:start}
.tier .rank{font-family:var(--f-display);font-weight:800;color:var(--orange-ink);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--blue-soft);color:var(--blue)}
.steps li div{display:grid;gap:2px;padding-top:5px}
.tpls{display:grid;gap:12px}
.tpl{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tpl summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;font-family:var(--f-display);font-weight:600}
.tpl summary::-webkit-details-marker{display:none}
.tpl summary::after{content:"+";font-size:1.3rem;color:var(--muted);line-height:1}
.tpl[open] summary::after{content:"−"}
.tpl pre{margin:0;padding:0 16px 14px;white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;line-height:1.55}
.tpl .acts{padding:0 16px 16px;display:flex;gap:8px;align-items:center}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stage{padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:grid;gap:2px}
.stage strong{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1}
.stage span{font-size:.76rem;color:var(--muted);font-weight:700}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;align-items:end}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table.sch{width:100%;border-collapse:collapse;font-size:.9rem;min-width:660px}
.sch th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
.sch td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.sch td input,.sch td select{width:100%;background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 6px}
.sch td input:hover,.sch td select:hover{border-color:var(--line)}
.sch td input:focus,.sch td select:focus{border-color:var(--blue);outline:none;background:var(--solid)}
.st{font-weight:700}
.st[data-v="todo"]{color:var(--muted)} .st[data-v="sent"]{color:var(--blue)} .st[data-v="rdv"]{color:var(--orange-ink)} .st[data-v="partner"]{color:var(--good)} .st[data-v="no"]{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--orange-ink);background:var(--orange-soft)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.relance{font-size:.74rem;font-weight:700;color:var(--warn);display:block}

/* Calendrier */
.tl{position:relative;display:grid;gap:0;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--orange))}
.ph{position:relative;padding:0 0 22px}
.ph::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--blue)}
.ph.key::before{border-color:var(--orange);background:var(--orange)}
.ph.now::before{width:16px;height:16px;left:-25px;top:3px;background:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}
.ph .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ph .when b{font-family:var(--f-display);font-weight:700}
.ph-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.ph-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.ph-cols div{display:grid;gap:3px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:.86rem;z-index:20;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

          <linearGradient id="lgo" x1="0" x2="1"><stop offset="0" stop-color="#FF7A5C"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
        </defs>
        <circle cx="30" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="70" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4"/>
        <rect x="8" y="30" width="48" height="38" rx="19" fill="none" stroke="currentColor" stroke-width="9"/>
        <rect x="44" y="30" width="48" height="38" rx="19" fill="none" stroke="url(#lgb)" stroke-width="9"/>
        <rect x="27" y="44" width="40" height="11" rx="5.5" fill="url(#lgo)"/>

</div>

<script>
(function(){
"use strict";
/* ---------- Contenu ---------- */
const START = new Date(2026,9,10); // point de départ du plan
const KPIS = [

function norm(s){const b=blank();s=s&&typeof s==="object"?s:{};for(const k in b){if(s[k]==null||typeof s[k]!==typeof b[k]||Array.isArray(b[k])!==Array.isArray(s[k]))s[k]=b[k];}s.names=Object.assign({},b.names,s.names);s.base=Object.assign({},b.base,s.base);return s;}

function persist(){
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(!ref||readOnly){return;}
  dirtyLocal=true;setSave("busy","Enregistrement…");
  clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  timer=null;
  if(saving){again=true;return;}
  saving=true;
  try{await ref.set(JSON.parse(JSON.stringify(state)));setSave("ok","Enregistré");}
  catch(e){
    if(e&&e.code==="invalid_argument"){readOnly=true;setSave("local","Lecture seule · sauvegarde sur cet appareil");}
    else if(e&&e.code==="unavailable"){setTimeout(flush,1500+Math.random()*1000);}
    else setSave("local","Non enregistré en ligne · gardé sur cet appareil");
  }
  saving=false;
  if(again){again=false;flush();}else if(!timer){dirtyLocal=false;}
}

/* ---------- Utilitaires ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("fr-FR");
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dShort=d=>d.getDate()+" "+MONTHS[d.getMonth()];
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w,key:y+"-W"+String(w).padStart(2,"0")};}
function weekRange(d){const m=new Date(d);const day=(m.getDay()+6)%7;m.setDate(m.getDate()-day);const s=new Date(m);s.setDate(s.getDate()+6);return [m,s];}
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
function addMonths(d,m){const x=new Date(d);x.setMonth(x.getMonth()+m);return x;}
function autoVal(id){const s=state.schools;if(id==="contacted")return s.filter(x=>x.status&&x.status!=="todo").length;if(id==="partners")return s.filter(x=>x.status==="partner").length;return 0;}
function actual(k){return k.auto?autoVal(k.id):Number(state.actual[k.id]||0);}
function target(k,p){const t=state.targets[k.id];return t&&t[p]!=null&&t[p]!==""?Number(t[p]):k.t[p];}
function isCustom(k,p){const t=state.targets[k.id];return !!(t&&t[p]!=null&&t[p]!=="");}
function toRelaunch(){const t=today();return state.schools.filter(s=>s.status==="sent"&&s.last&&daysBetween(new Date(s.last+"T00:00:00"),t)>=7);}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800);}

  return `
  <div class="head"><div class="eyebrow">Objectifs</div><h2>Où on veut être le ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}</h2>
    <p>Saisis tes vrais chiffres chaque dimanche. Les cibles sont modifiables : clique sur un nombre pour le changer.</p></div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div class="seg" role="group" aria-label="Horizon">${labels.map((l,i)=>`<button data-act="period" data-p="${i}" aria-pressed="${i===p}">${l}</button>`).join("")}</div>
    <span class="muted" style="font-size:.85rem">Départ : 10 oct. 2026</span>
  </div>
  <p class="note">Les cibles marquées « Estimation » sont des ordres de grandeur pour un compte qui démarre sans publicité. Elles ne reposent sur aucune statistique publiée. Remplace-les par tes propres objectifs après 4 semaines de chiffres réels.</p>
  <div class="kpi-head eyebrow"><span>Indicateur</span><span>Cible ${labels[p]}</span><span>Réel</span><span>Progression</span></div>
  <div class="kpis">${rows}</div>
  <section class="panel"><h3>Point de départ</h3><p class="muted" style="font-size:.88rem;margin:-6px 0 12px">Les chiffres d'aujourd'hui, pour mesurer le chemin parcouru.</p>
    <div class="base">
      <label class="lab">Abonnés TikTok<input class="field num" type="number" min="0" id="b-tt" data-bind="base" data-id="tt" value="${esc(b.tt)}" placeholder="—"></label>
      <label class="lab">Abonnés Instagram<input class="field num" type="number" min="0" id="b-ig" data-bind="base" data-id="ig" value="${esc(b.ig)}" placeholder="—"></label>
      <label class="lab">Vues moyennes / vidéo<input class="field num" type="number" min="0" id="b-views" data-bind="base" data-id="views" value="${esc(b.views)}" placeholder="—"></label>
      <label class="lab">Heures marketing / semaine<input class="field num" type="number" min="0" id="b-hours" data-bind="base" data-id="hours" value="${esc(b.hours)}" placeholder="—"></label>
    </div></section>`;
}

function vLyceens(){
  const f=ui.pillar;
  const list=IDEAS.filter(i=>f==="all"||i.p===f);
  const shotN=IDEAS.filter(i=>state.shot[i.id]).length;
  return `
  <div class="head"><div class="eyebrow">Toucher les lycéens</div><h2>Être là où ils se posent la question</h2>
    <p>Les réseaux pour se faire connaître, les établissements pour gagner la confiance. Les deux se renforcent.</p></div>
  <section><h3 style="margin-bottom:12px">5 piliers de contenu</h3><div class="pillars">
    ${Object.entries(PILLARS).map(([k,v])=>`<div class="pillar"><span class="k" style="background:${v.c}">${k}</span><b style="font-family:var(--f-display);font-weight:600">${esc(v.n)}</b><span class="muted" style="font-size:.86rem">${esc(v.d)}</span><span class="chip or" style="justify-self:start">${esc(v.f)}</span></div>`).join("")}
  </div></section>
  <section class="panel"><h3>Le rythme</h3>
    <div class="rhythm">
      <div><strong class="num">7</strong><span>TikTok par semaine</span><span class="muted" style="font-size:.82rem">Tu y es déjà, tiens le cap</span></div>
      <div><strong class="num">3</strong><span>Reels Instagram</span><span class="muted" style="font-size:.82rem">Les meilleurs TikTok, sans le logo TikTok</span></div>
      <div><strong class="num">5</strong><span>Stories</span><span class="muted" style="font-size:.82rem">Sondages et questions pour créer l'échange</span></div>
      <div><strong class="num">1</strong><span>Carrousel</span><span class="muted" style="font-size:.82rem">Le contenu « à enregistrer » de la semaine</span></div>
    </div>
    <p class="note" style="margin-top:14px">Horaires : hypothèse de départ en fin de journée de semaine (après les cours) et le week-end. À vérifier dans les statistiques de ton compte, qui montrent quand tes abonnés sont actifs. Les 3 premières secondes comptent le plus : chaque idée ci-dessous a son accroche.</p>
  </section>
  <section style="display:grid;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>Banque d'idées de vidéos</h3><span class="muted num" style="font-size:.85rem">${shotN} tournée${shotN>1?"s":""} sur ${IDEAS.length}</span></div>
    <div class="filters" role="group" aria-label="Filtrer par pilier"><button data-act="pillar" data-p="all" aria-pressed="${f==="all"}">Toutes</button>${Object.entries(PILLARS).map(([k,v])=>`<button data-act="pillar" data-p="${k}" aria-pressed="${f===k}">${k} · ${esc(v.n)}</button>`).join("")}</div>
    <div class="ideas">${list.map(i=>`<article class="idea ${state.shot[i.id]?"shot":""}">
      <div class="top-r"><span class="chip" style="background:color-mix(in srgb,${PILLARS[i.p].c} 15%,transparent);color:var(--ink)">${i.p} · ${esc(PILLARS[i.p].n)}</span>
      <button class="btn small" data-act="shot" data-id="${i.id}" aria-pressed="${!!state.shot[i.id]}">${state.shot[i.id]?"Tournée ✓":"Marquer tournée"}</button></div>
      <h4>${esc(i.t)}</h4><p class="hook">${esc(i.h)}</p><p class="meta">${esc(i.f)}</p></article>`).join("")}</div>
  </section>
  <section class="panel"><h3>Hors réseaux</h3><div class="offline">
    ${OFFLINE.map(o=>`<div class="off"><div style="display:grid;gap:6px;align-content:start"><b>${esc(o.t)}</b><span class="chip" style="justify-self:start">${esc(o.k)}</span></div><p style="font-size:.92rem">${esc(o.d)}</p></div>`).join("")}
  </div></section>
  <section class="legal"><h3>Les règles avec des mineurs</h3><ul>
    <li>Aucune donnée de lycéen collectée hors de la plateforme : pas de formulaire Google, pas de liste de numéros.</li>
    <li>Ne contacte pas un lycéen en message privé et n'entre pas dans les groupes de classe. Laisse-les partager le lien ou le QR code eux-mêmes.</li>
    <li>Pour filmer un mineur, il faut l'autorisation écrite de ses parents. Sans elle, filme des étudiants majeurs.</li>
    <li>En France, avant 15 ans, le consentement des parents est requis pour les traitements de données fondés sur le consentement : à prévoir sur la plateforme.</li>
    <li>Toute intervention dans un lycée passe par la direction ou un professeur.</li>
  </ul></section>`;
}

function vEcoles(){
  const S=state.schools,cnt=k=>S.filter(s=>s.status===k).length;
  const rel=new Set(toRelaunch().map(s=>s.id));
  return `
  <div class="head"><div class="eyebrow">Toucher les écoles</div><h2>Trouver les 3 premières écoles partenaires</h2>
    <p>Sans chiffres de traction, vise les écoles qui ont le plus besoin de se faire connaître, et parle-leur du moment Parcoursup.</p></div>
  <div class="grid3">${TIERS.map(t=>`<section class="panel tier"><span class="rank">${esc(t.r)}</span><h3>${esc(t.t)}</h3><p class="muted" style="font-size:.88rem">${esc(t.w)}</p></section>`).join("")}</div>
  <div class="grid2">
    <section class="panel"><h3>La méthode</h3><ol class="steps">${STEPS.map(s=>`<li><div><b>${esc(s[0])}</b><span class="muted" style="font-size:.88rem">${esc(s[1])}</span></div></li>`).join("")}</ol></section>
    <section class="panel"><h3>Ce que tu leur dis</h3><div style="display:grid;gap:12px">${ARGS.map(a=>`<div style="display:grid;gap:2px"><b>${esc(a[0])}</b><span class="muted" style="font-size:.88rem">${esc(a[1])}</span></div>`).join("")}</div>
      <p class="note" style="margin-top:14px">Ne promets ni nombre de lycéens ni résultats tant que tu n'as pas tes propres chiffres. Proposer un pilote aux premières écoles est une piste à valider de ton côté.</p></section>
  </div>
  <section style="display:grid;gap:10px"><h3>Modèles de messages</h3><div class="tpls">${TPLS.map((t,i)=>`<details class="tpl" ${i===0?"open":""}><summary>${esc(t.t)}</summary><pre id="tpl-${t.id}">${esc(t.x)}</pre><div class="acts"><button class="btn small primary" data-act="copy" data-id="${t.id}">Copier</button><span class="muted" style="font-size:.8rem">Remplace les [crochets] avant d'envoyer</span></div></details>`).join("")}</div></section>
  <section class="panel" style="display:grid;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Suivi de prospection</h3><span class="muted num" style="font-size:.85rem">${S.length} école${S.length>1?"s":""}</span></div>
    <div class="pipeline">${STATUS.map(([k,l])=>`<div class="stage"><strong class="num st" data-v="${k}" style="text-decoration:none">${cnt(k)}</strong><span>${l}</span></div>`).join("")}</div>
    <form class="add" id="addform">
      <label class="lab">École<input class="field" id="n-name" placeholder="Nom de l'école" required></label>
      <label class="lab">Ville<input class="field" id="n-city" placeholder="Ville"></label>
      <label class="lab">Contact<input class="field" id="n-contact" placeholder="Fonction ou nom"></label>
      <button class="btn primary" type="submit">Ajouter</button>
    </form>
    ${S.length?`<div class="tablewrap"><table class="sch"><thead><tr><th style="width:24%">École</th><th style="width:14%">Ville</th><th style="width:18%">Contact</th><th style="width:16%">Statut</th><th style="width:14%">Dernier contact</th><th>Note</th><th></th></tr></thead><tbody>
      ${S.map(s=>`<tr>
        <td><input id="s-${s.id}-name" data-bind="school" data-id="${s.id}" data-f="name" value="${esc(s.name)}" aria-label="École">${rel.has(s.id)?`<span class="relance">À relancer</span>`:""}</td>
        <td><input id="s-${s.id}-city" data-bind="school" data-id="${s.id}" data-f="city" value="${esc(s.city)}" aria-label="Ville"></td>
        <td><input id="s-${s.id}-contact" data-bind="school" data-id="${s.id}" data-f="contact" value="${esc(s.contact)}" aria-label="Contact"></td>
        <td><select id="s-${s.id}-status" class="st" data-v="${esc(s.status)}" data-bind="school" data-id="${s.id}" data-f="status" aria-label="Statut">${STATUS.map(([k,l])=>`<option value="${k}" ${s.status===k?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><input id="s-${s.id}-last" type="date" class="num" data-bind="school" data-id="${s.id}" data-f="last" value="${esc(s.last)}" aria-label="Dernier contact"></td>
        <td><input id="s-${s.id}-note" data-bind="school" data-id="${s.id}" data-f="note" value="${esc(s.note)}" placeholder="—" aria-label="Note"></td>
        <td><button class="x" data-act="del" data-id="${s.id}" aria-label="Supprimer ${esc(s.name)}">×</button></td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Aucune école pour l'instant. Ajoute la première avec le formulaire ci-dessus : elle apparaîtra ici avec son statut, et le compteur « Écoles contactées » des objectifs se mettra à jour tout seul.</div>`}
  </section>`;
}

function vCalendrier(){
  const t=today();
  let nowIdx=-1;PHASES.forEach((p,i)=>{if(p.d<=t)nowIdx=i;});
  return `
  <div class="head"><div class="eyebrow">Calendrier</div><h2>Suivre le rythme de Parcoursup</h2>
    <p>Chaque période a ses questions. Publier la bonne vidéo au bon moment vaut plus que publier davantage.</p></div>
  <p class="note">Dates indicatives pour la session 2027, tirées d'un guide en ligne (Les Sherpas). Le calendrier officiel est publié sur parcoursup.gouv.fr : vérifie-le avant de communiquer une date.</p>
  <div class="tl">${PHASES.map((p,i)=>`<div class="ph ${p.k?"key":""} ${i===nowIdx?"now":""}">
    <div class="when"><b>${esc(p.w)}</b>${i===nowIdx?`<span class="chip">Maintenant</span>`:""}${p.k?`<span class="chip or">Date clé</span>`:""}</div>
    <div class="ph-card"><h3>${esc(p.t)}</h3><div class="ph-cols">
      <div><span class="eyebrow">Les lycéens</span><span>${esc(p.l)}</span></div>
      <div><span class="eyebrow">On publie</span><span>${esc(p.c)}</span></div>
      <div><span class="eyebrow">Côté écoles</span><span>${esc(p.s)}</span></div>
    </div></div></div>`).join("")}</div>`;
}

const VIEWS={semaine:vSemaine,objectifs:vObjectifs,lyceens:vLyceens,ecoles:vEcoles,calendrier:vCalendrier};
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===ui.tab));
  document.getElementById("app").innerHTML=`<div class="view" role="tabpanel" aria-labelledby="t-${ui.tab}">${VIEWS[ui.tab]()}</div>`;
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab");
  if(tab){ui.tab=tab.dataset.tab;saveUi();try{history.replaceState(null,"","#"+ui.tab);}catch(_){}render();window.scrollTo({top:0});return;}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="check"){const k=isoWeek(today()).key;state.checks[k]=state.checks[k]||{};state.checks[k][id]=el.checked;
    const ks=Object.keys(state.checks).sort();while(ks.length>12)delete state.checks[ks.shift()];
    persist();render();}
  else if(a==="period"){ui.period=Number(el.dataset.p);saveUi();render();}
  else if(a==="pillar"){ui.pillar=el.dataset.p;saveUi();render();}
  else if(a==="shot"){state.shot[id]=!state.shot[id];persist();render();}
  else if(a==="del"){
    if(el.dataset.confirm){state.schools=state.schools.filter(s=>s.id!==id);persist();render();}
    else{el.dataset.confirm="1";el.textContent="Supprimer ?";el.style.fontSize=".78rem";setTimeout(()=>{if(el.isConnected){delete el.dataset.confirm;el.textContent="×";el.style.fontSize="";}},3000);}
  }
  else if(a==="copy"){const tp=TPLS.find(x=>x.id===id);
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("tpl-"+id));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texte sélectionné : copie-le");};
    try{navigator.clipboard.writeText(tp.x).then(()=>toast("Copié"),fallback);}catch(_){fallback();}}
});
document.addEventListener("input",e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==="name"){state.names[el.dataset.o]=el.value.slice(0,30);}
  else if(b==="actual"){state.actual[el.dataset.id]=el.value===""?"":Math.max(0,Number(el.value));}
  else if(b==="base"){state.base[el.dataset.id]=el.value;}
  else if(b==="target"){const t=state.targets[el.dataset.id]=state.targets[el.dataset.id]||{};t[ui.period]=el.value===""?null:Math.max(0,Number(el.value));}
  else if(b==="school"){const s=state.schools.find(x=>x.id===el.dataset.id);if(s){s[el.dataset.f]=el.value;
    if(el.dataset.f==="status"){el.dataset.v=el.value;if(el.value==="sent"&&!s.last){s.last=new Date().toISOString().slice(0,10);}}}}
  persist();
});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.bind)return;
  const b=el.dataset.bind;
  if(b==="actual"||b==="target"||(b==="school"&&(el.dataset.f==="status"||el.dataset.f==="last"||el.dataset.f==="name"))){
    setTimeout(()=>{const a=document.activeElement,id=a&&a.id;render();if(id){const n=document.getElementById(id);if(n)n.focus();}},0);
  }
});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRemote&&!editing()){state=norm(pendingRemote);pendingRemote=null;try{localStorage.setItem(LS,JSON.stringify(state));}catch(_){}render();}},0);});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addform")return;e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const name=v("n-name");if(!name)return;
  state.schools.push({id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,city:v("n-city"),contact:v("n-contact"),status:"todo",last:"",note:""});
  persist();render();const f=document.getElementById("n-name");if(f)f.focus();toast("École ajoutée");
});
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest("#app")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);}

render();

/* ---------- Synchronisation ---------- */
(async()=>{
  let cap=null;
  try{cap=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(_){cap=null;}
  if(!cap){setSave("local","Enregistré sur cet appareil");return;}
  db=cap;ref=db.doc("plan/main");
  let first=true;
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(!snap.exists){if(first){first=false;flush();}return;}
    first=false;
    const incoming=snap.data();
    if(JSON.stringify(norm(JSON.parse(JSON.stringify(incoming))))===JSON.stringify(state)){setSave("ok","Enregistré");return;}
    if(saving||dirtyLocal){return;}
    if(editing()){pendingRemote=JSON.parse(JSON.stringify(incoming));return;}
    state=norm(JSON.parse(JSON.stringify(incoming)));
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(_){}
    setSave("ok","Enregistré");render();
  },err=>{setSave("local","Enregistré sur cet appareil");ref=null;});
})();
})();
</script>

</body></html>
